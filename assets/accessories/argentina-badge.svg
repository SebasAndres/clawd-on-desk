<?xml version="1.0" encoding="UTF-8"?>
<!-- Argentina jersey — pixel art (14x5 grid). A worn shirt band (not a hat):
     the Albiceleste's vertical sky-blue/white stripes with a small sun on the
     chest, anchored in pet-customization-catalog.js to sit low, over the
     chest/belly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 5" shape-rendering="crispEdges" width="14" height="5">
  <g fill="#75aadb">
    <rect x="0" y="1" width="2" height="3"/>
    <rect x="4" y="1" width="2" height="3"/>
    <rect x="8" y="1" width="2" height="3"/>
    <rect x="12" y="1" width="2" height="3"/>
  </g>
  <g fill="#f4f6f8">
    <rect x="2" y="1" width="2" height="3"/>
    <rect x="6" y="1" width="2" height="3"/>
    <rect x="10" y="1" width="2" height="3"/>
  </g>
  <rect x="0" y="4" width="14" height="1" fill="#5a86ad"/>
  <!-- collar notch -->
  <rect x="6" y="0" width="2" height="1" fill="#f4f6f8"/>
  <!-- sun -->
  <rect x="6" y="2" width="2" height="1" fill="#e0b34a"/>
</svg>
