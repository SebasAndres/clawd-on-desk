<?xml version="1.0" encoding="UTF-8"?>
<!-- Escarapela — pixel art (11x11 grid). Nested light-blue/white/light-blue Argentine cockade. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11 11" shape-rendering="crispEdges" width="11" height="11">
  <g fill="#75aadb">
    <rect x="2" y="0" width="7" height="1"/>
    <rect x="1" y="1" width="9" height="1"/>
    <rect x="0" y="2" width="11" height="1"/>
    <rect x="0" y="3" width="11" height="1"/>
    <rect x="0" y="4" width="11" height="1"/>
    <rect x="0" y="5" width="11" height="1"/>
    <rect x="0" y="6" width="11" height="1"/>
    <rect x="0" y="7" width="11" height="1"/>
    <rect x="0" y="8" width="11" height="1"/>
    <rect x="1" y="9" width="9" height="1"/>
    <rect x="2" y="10" width="7" height="1"/>
  </g>
  <g fill="#f4f6f8">
    <rect x="3" y="1" width="5" height="1"/>
    <rect x="2" y="2" width="7" height="1"/>
    <rect x="1" y="3" width="9" height="1"/>
    <rect x="1" y="4" width="9" height="1"/>
    <rect x="1" y="5" width="9" height="1"/>
    <rect x="1" y="6" width="9" height="1"/>
    <rect x="1" y="7" width="9" height="1"/>
    <rect x="2" y="8" width="7" height="1"/>
    <rect x="3" y="9" width="5" height="1"/>
  </g>
  <g fill="#75aadb">
    <rect x="4" y="3" width="3" height="1"/>
    <rect x="3" y="4" width="5" height="1"/>
    <rect x="3" y="5" width="5" height="1"/>
    <rect x="3" y="6" width="5" height="1"/>
    <rect x="4" y="7" width="3" height="1"/>
  </g>
  <rect x="5" y="5" width="1" height="1" fill="#f4f6f8"/>
</svg>
