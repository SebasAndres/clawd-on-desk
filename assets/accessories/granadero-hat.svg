<?xml version="1.0" encoding="UTF-8"?>
<!-- Granadero — pixel art (20x21 grid). Tall ceremonial shako with red plume
     and gold band (rows 0-11, centered, after the Granaderos a Caballo
     regiment), plus a saber held out to the right (rows 12-20, offset
     sideways rather than straight down) reaching toward hip height. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 21" shape-rendering="crispEdges" width="20" height="21">
  <g fill="#c22a2a">
    <rect x="9" y="0" width="1" height="1"/>
    <rect x="8" y="1" width="3" height="1"/>
    <rect x="8" y="2" width="3" height="1"/>
  </g>
  <g fill="#1b1b22">
    <rect x="6" y="3" width="8" height="1"/>
    <rect x="6" y="4" width="8" height="1"/>
    <rect x="6" y="5" width="8" height="1"/>
    <rect x="6" y="6" width="8" height="1"/>
    <rect x="6" y="7" width="8" height="1"/>
    <rect x="6" y="9" width="8" height="1"/>
  </g>
  <rect x="6" y="8" width="8" height="1" fill="#e0b34a"/>
  <rect x="4" y="10" width="12" height="1" fill="#1b1b22"/>
  <rect x="3" y="11" width="14" height="1" fill="#141419"/>
  <!-- saber, held out to the right — offset past the eyes, not straight down -->
  <rect x="16" y="12" width="4" height="1" fill="#e0b34a"/>
  <rect x="17" y="13" width="2" height="1" fill="#6b4a2b"/>
  <g fill="#c9d3dc">
    <rect x="17" y="14" width="2" height="1"/>
    <rect x="17" y="15" width="2" height="1"/>
    <rect x="17" y="16" width="2" height="1"/>
    <rect x="17" y="17" width="2" height="1"/>
    <rect x="17" y="18" width="2" height="1"/>
    <rect x="17" y="19" width="2" height="1"/>
  </g>
  <rect x="17" y="20" width="1" height="1" fill="#eef3f7"/>
</svg>
