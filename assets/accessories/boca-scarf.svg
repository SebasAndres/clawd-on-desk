<?xml version="1.0" encoding="UTF-8"?>
<!-- Boca Juniors jersey — pixel art (15x5 grid). A worn shirt band (not a hat):
     striped blue/gold torso with a collar notch, sized and anchored in
     pet-customization-catalog.js to sit low, over the chest/belly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 5" shape-rendering="crispEdges" width="15" height="5">
  <g fill="#0a2f6b">
    <rect x="0" y="1" width="15" height="1"/>
    <rect x="0" y="3" width="15" height="1"/>
  </g>
  <g fill="#f5c518">
    <rect x="0" y="2" width="6" height="1"/>
    <rect x="9" y="2" width="6" height="1"/>
  </g>
  <rect x="0" y="4" width="15" height="1" fill="#061c40"/>
  <!-- collar notch -->
  <g fill="#f4f6f8">
    <rect x="6" y="0" width="3" height="1"/>
    <rect x="7" y="1" width="1" height="1"/>
  </g>
</svg>
